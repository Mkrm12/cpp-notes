<script>window.MOCK = {"id":"mock1","short":"Mock 1","title":"Mock interview 1","flavour":"Standard format","sub":"The usual order: introductions, spoken C++ theory with follow-ups, snippets in the chat, two live coding problems, then SQL.","minutes":30,"other":{"href":"mock2.html","label":"Mock interview 2"},"cards":[{"id":"hello","sec":"Intro","type":"talk","aim":[5,15],"limit":30,"q":"Hi, thanks for joining. Can you hear me alright? How's your day going?"},{"id":"about","sec":"Intro","type":"talk","aim":[60,90],"limit":110,"q":"Great. To start, tell me a bit about yourself and your background."},{"id":"why","sec":"Intro","type":"talk","aim":[40,60],"limit":80,"q":"Why mthree, and why a C++ role at Amadeus?"},{"id":"ptr-ref","sec":"C++ theory","type":"talk","aim":[40,60],"limit":80,"q":"Okay, let's move on to some C++. What is the difference between a pointer and a reference?"},{"id":"ptr-when","sec":"C++ theory","follow":true,"type":"talk","aim":[15,30],"limit":45,"q":"And when would you choose a pointer instead of a reference?"},{"id":"passing","sec":"C++ theory","type":"talk","aim":[40,60],"limit":80,"q":"What's the difference between passing by value, by reference, and by const reference?"},{"id":"snip-pass","sec":"Chat snippet","type":"talk","aim":[25,40],"limit":60,"fine":"In the real call this is pasted into the Teams chat.","q":"I've pasted a snippet in the chat. What does it print, and why?","code":"void doubleIt(int n)  { n = n * 2; }\nvoid tripleIt(int& n) { n = n * 3; }\n\nint main() {\n    int a = 4;\n    doubleIt(a);\n    tripleIt(a);\n    cout \u003c\u003c a;\n}"},{"id":"stack-heap","sec":"C++ theory","type":"talk","aim":[40,60],"limit":80,"q":"What is the difference between the stack and the heap?"},{"id":"leak","sec":"C++ theory","follow":true,"type":"talk","aim":[25,40],"limit":60,"q":"What is a memory leak, and how do smart pointers help?"},{"id":"pillars","sec":"OOP","type":"talk","aim":[50,75],"limit":95,"q":"What are the four pillars of object-oriented programming? Give me a sentence on each."},{"id":"virtual","sec":"OOP","follow":true,"type":"talk","aim":[25,40],"limit":60,"q":"You mentioned polymorphism. What does the \u003ccode>virtual\u003c/code> keyword do?","say":"You mentioned polymorphism. What does the virtual keyword do?"},{"id":"predict1","sec":"Chat snippet","type":"predict","limit":75,"aimText":"Type it, then say why","q":"Another one in the chat. What does this print?","fine":"Type the output exactly as it would appear on screen, and explain it out loud.","code":"int x = 3;\nint y = x++;\nint z = ++x;\nif (y = 0) cout \u003c\u003c \"A \";\nelse       cout \u003c\u003c \"B \";\ncout \u003c\u003c x \u003c\u003c \" \" \u003c\u003c y \u003c\u003c \" \" \u003c\u003c z;"},{"id":"fix-avg","sec":"Fix the bug","type":"fix","limit":120,"aimText":"Find it, fix it, run it","q":"This should print 3.5, but it doesn't. Tell me what's wrong, then fix it.","detail":"\u003cul>\u003cli>Press \u003cb>Run\u003c/b> first to see what it prints now.\u003c/li>\u003cli>Change as little as you can.\u003c/li>\u003c/ul>","starter":"#include \u003ciostream>\n#include \u003cvector>\nusing namespace std;\n\ndouble average(const vector\u003cint>& scores) {\n    int total = 0;\n    for (int i = 0; i \u003c scores.size(); i++) {\n        total += scores[i];\n    }\n    return total / scores.size();\n}\n\nint main() {\n    vector\u003cint> scores = {3, 4};\n    cout \u003c\u003c average(scores);   // should print 3.5\n    return 0;\n}\n"},{"id":"reverse","sec":"Live coding","type":"code","limit":360,"aimText":"Aim to have it running in 4 min","q":"Now some live coding. Write a function \u003ccode>reverseString\u003c/code> that takes a string and returns it reversed.","say":"Now some live coding. Write a function, reverse string, that takes a string and returns it reversed. Please don't use the built in reverse. Talk me through your plan before you type.","detail":"\u003cul>\u003cli>Please don't use \u003ccode>std::reverse\u003c/code>.\u003c/li>\u003cli>Talk me through your plan before you type.\u003c/li>\u003cli>\u003ccode>main\u003c/code> is already written. It should print the three \"want\" lines.\u003c/li>\u003c/ul>","starter":"#include \u003ciostream>\n#include \u003cstring>\nusing namespace std;\n\n// Write reverseString here\n\n\nint main() {\n    cout \u003c\u003c reverseString(\"hello\") \u003c\u003c endl;     // want: olleh\n    cout \u003c\u003c reverseString(\"Heathrow\") \u003c\u003c endl;  // want: worhtaeH\n    cout \u003c\u003c reverseString(\"a\") \u003c\u003c endl;         // want: a\n    return 0;\n}\n"},{"id":"reverse-talk","sec":"Live coding","follow":true,"type":"talk","aim":[30,45],"limit":70,"showCodeOf":"reverse","q":"Walk me through your code. What's its time complexity? And how would you use it to check for a palindrome?"},{"id":"vowels","sec":"Live coding","type":"code","limit":270,"aimText":"Aim to have it running in 3 min","q":"One more. Write a function \u003ccode>countVowels\u003c/code> that takes a string and returns how many vowels it contains.","say":"One more. Write a function, count vowels, that takes a string and returns how many vowels it contains.","detail":"\u003cul>\u003cli>Vowels are a, e, i, o, u.\u003c/li>\u003cli>Capital letters count too.\u003c/li>\u003cli>\u003ccode>main\u003c/code> is already written. It should print the three \"want\" lines.\u003c/li>\u003c/ul>","starter":"#include \u003ciostream>\n#include \u003cstring>\nusing namespace std;\n\n// Write countVowels here\n\n\nint main() {\n    cout \u003c\u003c countVowels(\"hello\") \u003c\u003c endl;    // want: 2\n    cout \u003c\u003c countVowels(\"AMADEUS\") \u003c\u003c endl;  // want: 4\n    cout \u003c\u003c countVowels(\"rhythm\") \u003c\u003c endl;   // want: 0\n    return 0;\n}\n"},{"id":"keys","sec":"SQL","type":"talk","aim":[20,35],"limit":55,"q":"Last topic, a little SQL. What is a primary key, and what is a foreign key?"},{"id":"sql-it","sec":"SQL","type":"sql","limit":100,"fine":"In the real call you type this into the chat, so there is no Run button here.","table":{"name":"Employees","cols":["emp_id","name","department","salary"],"rows":[["1","Aisha","IT","52000"],["2","Ben","Sales","38000"],["3","Chen","IT","61000"],["4","Dee","HR","41000"]]},"q":"Here's a table. Write a query that returns the name and salary of everyone in the IT department, highest paid first."},{"id":"sql-second","sec":"SQL","type":"sql","limit":120,"fine":"In the real call you type this into the chat, so there is no Run button here.","table":{"name":"Employees","cols":["emp_id","name","department","salary"],"rows":[["1","Aisha","IT","52000"],["2","Ben","Sales","38000"],["3","Chen","IT","61000"],["4","Dee","HR","41000"]]},"q":"Same table. Write a query that finds the second-highest salary."},{"id":"close","sec":"Close","type":"talk","aim":[20,40],"limit":60,"q":"That's everything from me. Do you have any questions for me?"}]};</script>
