<script>window.MOCK = {"id":"mock2","short":"Mock 2","title":"Mock interview 2","flavour":"Quick-fire and classes","sub":"A different interviewer: a burst of short questions, then classes and objects, a from-scratch coding problem, bugs to spot, and SQL.","minutes":30,"other":{"href":"mock1.html","label":"Mock interview 1"},"cards":[{"id":"hello","sec":"Intro","type":"talk","aim":[5,15],"limit":25,"q":"Hello! Thanks for making the time. Is now still a good time, and is your audio okay?"},{"id":"about","sec":"Intro","type":"talk","aim":[45,60],"limit":80,"q":"Give me a quick introduction. Who are you, and what have you been doing recently?"},{"id":"mthree","sec":"Intro","type":"talk","aim":[30,45],"limit":65,"q":"What do you know about mthree, and how this programme works?"},{"id":"qf-const","sec":"Quick-fire","type":"talk","aim":[10,20],"limit":30,"q":"I'm going to ask some quick-fire questions now. Short answers are fine. First: what does \u003ccode>const\u003c/code> mean?","say":"I'm going to ask some quick-fire questions now. Short answers are fine. First: what does const mean?"},{"id":"qf-null","sec":"Quick-fire","type":"talk","aim":[10,20],"limit":30,"q":"What is \u003ccode>nullptr\u003c/code>?","say":"What is null pointer, the keyword?"},{"id":"qf-struct","sec":"Quick-fire","type":"talk","aim":[10,20],"limit":30,"q":"What's the difference between a \u003ccode>struct\u003c/code> and a \u003ccode>class\u003c/code>?","say":"What's the difference between a struct and a class?"},{"id":"qf-ctor","sec":"Quick-fire","type":"talk","aim":[15,25],"limit":40,"q":"What is a constructor, and what is a destructor?"},{"id":"qf-vector","sec":"Quick-fire","type":"talk","aim":[15,25],"limit":35,"q":"What's the difference between an array and a \u003ccode>vector\u003c/code>?","say":"What's the difference between an array and a vector?"},{"id":"qf-map","sec":"Quick-fire","type":"talk","aim":[15,25],"limit":35,"q":"What is an \u003ccode>unordered_map\u003c/code>, and how fast is a lookup?","say":"What is an unordered map, and how fast is a lookup?"},{"id":"qf-raii","sec":"Quick-fire","type":"talk","aim":[15,25],"limit":35,"q":"What is RAII, in a sentence or two?","say":"What is R A I I, in a sentence or two?"},{"id":"qf-amp","sec":"Quick-fire","type":"talk","aim":[15,25],"limit":35,"q":"The \u003ccode>&amp;\u003c/code> symbol means two different things in C++. What are they?","say":"The ampersand symbol means two different things in C plus plus. What are they?"},{"id":"access","sec":"Classes","type":"talk","aim":[25,40],"limit":60,"q":"Let's talk about classes. What's the difference between \u003ccode>public\u003c/code>, \u003ccode>private\u003c/code> and \u003ccode>protected\u003c/code>?","say":"Let's talk about classes. What's the difference between public, private and protected?"},{"id":"flight","sec":"Live coding","type":"code","limit":360,"aimText":"Aim to have it running in 4 min","q":"I'd like you to write a small class called \u003ccode>Flight\u003c/code>.","say":"I'd like you to write a small class called Flight. It stores a flight number and how many seats are left. The details are on screen. Talk me through it as you go.","detail":"\u003cul>\u003cli>It stores a \u003cb>flight number\u003c/b> (text) and the \u003cb>seats left\u003c/b> (a whole number).\u003c/li>\u003cli>Code outside the class must \u003cb>not\u003c/b> be able to change them directly.\u003c/li>\u003cli>The \u003cb>constructor\u003c/b> takes the flight number and the seat count.\u003c/li>\u003cli>\u003ccode>book()\u003c/code> takes one seat and returns \u003ccode>true\u003c/code>. If no seats are left it returns \u003ccode>false\u003c/code> and changes nothing.\u003c/li>\u003cli>\u003ccode>getSeatsLeft()\u003c/code> and \u003ccode>getNumber()\u003c/code> return the two values.\u003c/li>\u003cli>\u003ccode>main\u003c/code> is already written. It should print the five \"want\" lines.\u003c/li>\u003c/ul>","starter":"#include \u003ciostream>\n#include \u003cstring>\nusing namespace std;\n\n// Write the Flight class here\n\n\nint main() {\n    Flight f(\"XY123\", 2);              // flight number, number of seats\n    cout \u003c\u003c f.book() \u003c\u003c endl;          // want: 1   (booked, 1 seat left)\n    cout \u003c\u003c f.book() \u003c\u003c endl;          // want: 1   (booked, 0 seats left)\n    cout \u003c\u003c f.book() \u003c\u003c endl;          // want: 0   (full, so refused)\n    cout \u003c\u003c f.getSeatsLeft() \u003c\u003c endl;  // want: 0\n    cout \u003c\u003c f.getNumber() \u003c\u003c endl;     // want: XY123\n    return 0;\n}\n"},{"id":"flight-talk","sec":"Classes","follow":true,"type":"talk","aim":[25,40],"limit":60,"showCodeOf":"flight","q":"Which of the OOP pillars is your class an example of? And why keep the data private?"},{"id":"fix-virtual","sec":"Fix the bug","type":"fix","limit":150,"aimText":"Find it, fix it, run it","q":"This should print Circle, then Square. Instead it prints Shape twice. Fix it, and tell me what was wrong.","detail":"\u003cul>\u003cli>Press \u003cb>Run\u003c/b> first to see what it prints now.\u003c/li>\u003cli>Change as little as you can.\u003c/li>\u003c/ul>","starter":"#include \u003ciostream>\n#include \u003cvector>\nusing namespace std;\n\nclass Shape {\npublic:\n    void name() { cout \u003c\u003c \"Shape\" \u003c\u003c endl; }\n};\n\nclass Circle : public Shape {\npublic:\n    void name() { cout \u003c\u003c \"Circle\" \u003c\u003c endl; }\n};\n\nclass Square : public Shape {\npublic:\n    void name() { cout \u003c\u003c \"Square\" \u003c\u003c endl; }\n};\n\nint main() {\n    Circle c;\n    Square s;\n    vector\u003cShape*> shapes = {&c, &s};\n    for (int i = 0; i \u003c shapes.size(); i++) {\n        shapes[i]->name();      // should print Circle, then Square\n    }\n    return 0;\n}\n"},{"id":"poly","sec":"Classes","follow":true,"type":"talk","aim":[30,45],"limit":65,"q":"Why did that fix it? And in your own words, what is polymorphism?"},{"id":"predict2","sec":"Chat snippet","type":"predict","limit":75,"aimText":"Type it, then say why","q":"I've pasted a snippet in the chat. What does this print?","fine":"Type the output exactly as it would appear on screen, and explain it out loud.","code":"int x = 5;\nint& r = x;\nint* p = &x;\nr = 8;\n*p = *p + 1;\ncout \u003c\u003c x \u003c\u003c \" \" \u003c\u003c r \u003c\u003c \" \" \u003c\u003c *p;"},{"id":"spot-dangle","sec":"Chat snippet","type":"talk","aim":[20,35],"limit":55,"fine":"In the real call this is pasted into the Teams chat.","q":"Here's another. It compiles, but something is wrong with it. What?","code":"int* makeScore() {\n    int score = 42;\n    return &score;\n}\n\nint main() {\n    int* p = makeScore();\n    cout \u003c\u003c *p;\n}"},{"id":"dupes","sec":"Live coding","type":"code","limit":300,"aimText":"Aim to have it running in 4 min","q":"Write a function \u003ccode>hasDuplicate\u003c/code> that takes a vector of ints and returns true if any number appears more than once.","say":"Write a function, has duplicate, that takes a vector of ints and returns true if any number appears more than once. This time you write main as well.","detail":"\u003cul>\u003cli>For example, {4, 9, 2, 9} gives true and {1, 2, 3} gives false.\u003c/li>\u003cli>This time you write \u003ccode>main\u003c/code> too: call your function on two test vectors and print the results.\u003c/li>\u003cli>Say your plan before you type.\u003c/li>\u003c/ul>","starter":"#include \u003ciostream>\n#include \u003cvector>\n#include \u003cunordered_map>\nusing namespace std;\n\n\n\nint main() {\n\n    return 0;\n}\n"},{"id":"dupes-talk","sec":"Live coding","follow":true,"type":"talk","aim":[25,40],"limit":60,"showCodeOf":"dupes","q":"What's the time complexity of your solution? What would it be with two nested loops, and why is a map faster?"},{"id":"spot-loop","sec":"Chat snippet","type":"talk","aim":[15,30],"limit":45,"fine":"In the real call this is pasted into the Teams chat.","q":"Last snippet. What's the bug here, and how would you fix it?","code":"vector\u003cstring> names = {\"Ann\", \"Ben\", \"Cy\"};\n\nfor (int i = 0; i \u003c= names.size(); i++) {\n    cout \u003c\u003c names[i] \u003c\u003c endl;\n}"},{"id":"where-having","sec":"SQL","type":"talk","aim":[15,25],"limit":40,"q":"A couple of SQL questions to finish. What's the difference between WHERE and HAVING?"},{"id":"sql-group","sec":"SQL","type":"sql","limit":110,"fine":"In the real call you type this into the chat, so there is no Run button here.","table":{"name":"Employees","cols":["emp_id","name","department","salary"],"rows":[["1","Aisha","IT","52000"],["2","Ben","Sales","38000"],["3","Chen","IT","61000"],["4","Dee","HR","41000"]]},"q":"Using this table, write a query that lists each department that has more than 2 employees, with its number of employees."},{"id":"joins","sec":"SQL","type":"talk","aim":[20,30],"limit":50,"q":"What's the difference between an INNER JOIN and a LEFT JOIN?"},{"id":"stuck","sec":"Close","type":"talk","aim":[40,60],"limit":75,"q":"Before we finish: tell me about a time you were stuck on something technical. What did you do?"},{"id":"close","sec":"Close","type":"talk","aim":[20,40],"limit":60,"q":"That's all from my side. What questions do you have for me?"}]};</script>
